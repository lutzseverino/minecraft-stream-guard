language:
  default-locale: es_ES
  fallback-locale: en_US
  per-player-locale: false
  use-client-locale: false

enforcement:
  grace-period-seconds: 120
  recheck-interval-seconds: 60
  allow-movement-while-unverified: true
  allow-chat-while-unverified: true
  unlinked:
    kick-on-join: false
    kick-delay-seconds: 0
    allow-movement: true
    allow-chat: true
    allow-commands: true
  not-live:
    kick-on-join: false
    kick-delay-seconds: 0
    allow-movement: true
    allow-chat: true
    allow-commands: true
  blocked-actions:
    block-break: true
    block-place: true
    block-interact: true
    container-open: true
    item-pickup: true
    item-drop: true
    inventory-click: false
    crafting: true
    villager-trading: true
    entity-damage: true
    entity-interact: true
    buckets: true
    fire: true

onboarding:
  enabled: true
  provider-picker:
    title: "<dark_gray>Choose stream provider</dark_gray>"
    rows: 3
    fill-empty-slots: true
    filler:
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []
      custom-model-data: 0
      glow: false
    cancel:
      slot: 22
      material: BARRIER
      name: "<red>Cancel</red>"
      lore:
        - "<gray>Close this setup flow.</gray>"
      custom-model-data: 0
      glow: false
    providers:
      twitch:
        enabled: true
        slot: 11
        material: PURPLE_WOOL
        name: "<light_purple>Twitch</light_purple>"
        lore:
          - "<gray>Click to enter your Twitch channel name.</gray>"
          - "<dark_gray>Example: lutzseverino</dark_gray>"
        input-hint: "Twitch channel name"
        custom-model-data: 0
        glow: false
      youtube:
        enabled: true
        slot: 15
        material: RED_WOOL
        name: "<red>YouTube</red>"
        lore:
          - "<gray>Click to enter your YouTube channel ID or handle.</gray>"
          - "<dark_gray>Example: @channel</dark_gray>"
        input-hint: "YouTube channel ID or @handle"
        custom-model-data: 0
        glow: false
  chat-input:
    timeout-seconds: 120
    max-length: 120
    cancel-keyword: cancel
    verify-after-link: true

web:
  live-feed:
    enabled: true
    bind-host: "127.0.0.1"
    port: 8127
    path: "/api/live"
    update-interval-seconds: 15
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://127.0.0.1:5173"
        - "http://localhost:4173"
        - "http://127.0.0.1:4173"

commands:
  safe-while-unverified:
    - stream
    - streamguard status
    - login
    - register
    - l
    - reg
    - msg
    - tell
    - r

bypass:
  ops-bypass-by-default: true
  allow-temporary-bypass: true
  max-temporary-bypass-minutes: 240
  log-bypass-changes: true

providers:
  twitch:
    enabled: true
    client-id: ""
    client-secret: ""
  youtube:
    enabled: false
    api-key: ""
