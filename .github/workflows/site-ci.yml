name: Site CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-node:
    name: Validate site (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Locate pnpm store
        id: pnpm-cache
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('site/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate site
        run: pnpm validate

  # Stable required context: passes only when every Node.js shard passed.
  validate-site:
    name: Validate site
    if: ${{ always() }}
    needs: validate-node
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Node.js shard
        env:
          RESULT: ${{ needs.validate-node.result }}
        run: |
          echo "Node.js matrix result: $RESULT"
          test "$RESULT" = "success"
