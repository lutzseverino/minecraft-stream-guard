name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify plugin
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          cache: maven
          cache-dependency-path: plugin/pom.xml
          distribution: temurin
          java-version: 21

      - name: Test sandbox verifier
        run: python3 ../.github/scripts/test-agent-sandbox.py

      - name: Test release note extraction
        run: python3 ../.github/scripts/test-release-notes.py

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify
