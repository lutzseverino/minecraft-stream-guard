name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish plugin
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact numeric Romantic Version, such as v1.0.0." >&2
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(./mvnw --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "${TAG_VERSION}" != "${POM_VERSION}" ]]; then
            echo "Tag ${TAG_VERSION} does not match pom.xml ${POM_VERSION}." >&2
            exit 1
          fi
          if [[ ! -s "docs/releases/${TAG_VERSION}.md" ]]; then
            echo "Missing non-empty release note: docs/releases/${TAG_VERSION}.md" >&2
            exit 1
          fi

          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate packaged plugin metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/StreamGuard-${{ steps.version.outputs.version }}.jar"
          test -s "${JAR}"
          PLUGIN_VERSION="$(unzip -p "${JAR}" plugin.yml | awk '$1 == "version:" { print $2; exit }')"
          if [[ "${PLUGIN_VERSION}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Packaged plugin.yml ${PLUGIN_VERSION} does not match the release version." >&2
            exit 1
          fi

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          {
            echo "body<<EOF"
            cat "docs/releases/${{ steps.version.outputs.version }}.md"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish to GitHub and Modrinth
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ steps.version.outputs.version }}
          github-prerelease: false
          github-generate-changelog: true

          modrinth-id: stream-guard
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version-type: release
          modrinth-featured: true

          files: target/StreamGuard-${{ steps.version.outputs.version }}.jar
          name: StreamGuard ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog-file: docs/releases/${{ steps.version.outputs.version }}.md
          loaders: |
            paper
            spigot
          game-versions: |
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
          java: |
            17

      - name: Publish to Hangar
        uses: benwoo1110/hangar-upload-action@9cd877c616a20ad49cd6ea8b4550b3264c1dabcf # main, pinned 2026-07-10
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          slug: stream-guard
          version: ${{ steps.version.outputs.version }}
          channel: release
          files: |
            [
              {
                "platforms": ["PAPER"],
                "path": "target/StreamGuard-${{ steps.version.outputs.version }}.jar"
              }
            ]
          description: ${{ steps.changelog.outputs.body }}
          platform_dependencies: '{"PAPER":["1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8"]}'
