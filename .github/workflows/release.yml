name: Release

on:
  push:
    tags:
      - "plugin-v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish plugin
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write

    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: plugin/pom.xml

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          POM_VERSION="$(./mvnw --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)"
          TAG_VERSION="$(bash ../.github/scripts/plugin-release-version.sh "$GITHUB_REF_NAME" "$POM_VERSION")"

          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Read annotated tag release notes
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/streamguard-release-notes.md"
          bash ../.github/scripts/read-release-notes.sh "$GITHUB_REF_NAME" "$notes_file"
          # A unique delimiter lets Markdown contain literal EOF lines.
          delimiter="release_notes_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "body<<${delimiter}"
            cat "$notes_file"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate packaged plugin metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/StreamGuard-${{ steps.version.outputs.version }}.jar"
          test -s "${JAR}"
          PLUGIN_VERSION="$(unzip -p "${JAR}" plugin.yml | awk '$1 == "version:" { print $2; exit }')"
          if [[ "${PLUGIN_VERSION}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Packaged plugin.yml ${PLUGIN_VERSION} does not match the release version." >&2
            exit 1
          fi

      - name: Publish to GitHub and Modrinth
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: plugin-v${{ steps.version.outputs.version }}
          github-prerelease: false
          github-generate-changelog: false

          modrinth-id: stream-guard
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version-type: release
          modrinth-featured: true

          files: plugin/target/StreamGuard-${{ steps.version.outputs.version }}.jar
          name: StreamGuard ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog-file: ${{ runner.temp }}/streamguard-release-notes.md
          loaders: |
            paper
            spigot
          game-versions: |
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
          java: |
            17

      - name: Publish to Hangar
        uses: benwoo1110/hangar-upload-action@9cd877c616a20ad49cd6ea8b4550b3264c1dabcf # main, pinned 2026-07-10
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          slug: stream-guard
          version: ${{ steps.version.outputs.version }}
          channel: release
          files: |
            [
              {
                "platforms": ["PAPER"],
                "path": "plugin/target/StreamGuard-${{ steps.version.outputs.version }}.jar"
              }
            ]
          description: ${{ steps.changelog.outputs.body }}
          platform_dependencies: '{"PAPER":["1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8"]}'
