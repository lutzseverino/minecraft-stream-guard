name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          fi
          VERSION_TYPE="release"
          if [[ "${VERSION}" == *alpha* ]]; then
            VERSION_TYPE="alpha"
          elif [[ "${VERSION}" == *beta* ]]; then
            VERSION_TYPE="beta"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_type=${VERSION_TYPE}" >> "${GITHUB_OUTPUT}"

      - name: Build
        run: mvn --batch-mode package

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          {
            echo "body<<EOF"
            cat "docs/releases/${{ steps.version.outputs.version }}.md"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish to GitHub and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ steps.version.outputs.version }}
          github-prerelease: ${{ steps.version.outputs.version_type != 'release' }}
          github-generate-changelog: true

          modrinth-id: stream-guard
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version-type: ${{ steps.version.outputs.version_type }}
          modrinth-featured: ${{ steps.version.outputs.version_type == 'release' }}

          files: target/StreamGuard-${{ steps.version.outputs.version }}.jar
          name: StreamGuard ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog-file: docs/releases/${{ steps.version.outputs.version }}.md
          loaders: |
            paper
            spigot
          game-versions: |
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
          java: |
            17

      - name: Publish to Hangar
        uses: benwoo1110/hangar-upload-action@main
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          slug: stream-guard
          version: ${{ steps.version.outputs.version }}
          channel: release
          files: |
            [
              {
                "platforms": ["PAPER"],
                "path": "target/StreamGuard-${{ steps.version.outputs.version }}.jar"
              }
            ]
          description: ${{ steps.changelog.outputs.body }}
          platform_dependencies: '{"PAPER":["1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8"]}'
