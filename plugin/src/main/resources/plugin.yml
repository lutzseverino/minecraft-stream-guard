name: StreamGuard
version: ${project.version}
main: com.lutzseverino.streamguard.bootstrap.StreamGuardPlugin
api-version: '1.20'
author: lutzseverino
description: Gates world interaction behind live stream verification.
website: https://github.com/lutzseverino/minecraft-stream-guard
softdepend:
  - LuckPerms
  - AuthMe
  - PlaceholderAPI
commands:
  stream:
    description: Link, set up, and inspect your stream verification status.
    usage: /stream [setup|status|link|verify|cancel]
  streamguard:
    description: Admin tools for StreamGuard.
    usage: /streamguard
permissions:
  streamguard.admin:
    description: Full access to StreamGuard admin commands.
    default: op
    children:
      streamguard.bypass: true
      streamguard.reload: true
      streamguard.status.others: true
      streamguard.bypass.always: true
  streamguard.bypass:
    description: Allows granting and removing temporary bypasses.
    default: op
  streamguard.reload:
    description: Allows reloading StreamGuard configuration.
    default: op
  streamguard.status.others:
    description: Allows viewing another player's stream verification status.
    default: op
  streamguard.bypass.always:
    description: Always bypasses StreamGuard enforcement.
    default: false
