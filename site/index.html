<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="StreamGuard — a live stream wall for Minecraft server communities. See who is live on Twitch and YouTube, right now."
    />
    <meta name="theme-color" content="#0a0a0f" />
    <title>StreamGuard · Live Wall</title>
    <script>
      // Apply the saved theme before first paint; keep in step with
      // src/theme/ThemeProvider.tsx. Dark is the default.
      (() => {
        let theme = "dark";
        try {
          theme = localStorage.getItem("streamguard-theme") ?? "dark";
        } catch {}
        const dark =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
            : theme !== "light";
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
