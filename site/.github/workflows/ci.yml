name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-node:
    name: Validate site (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate site
        run: pnpm validate

  # Stable required context: passes only when every Node.js shard passed.
  validate-site:
    name: Validate site
    if: ${{ always() }}
    needs: validate-node
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Node.js shard
        env:
          RESULT: ${{ needs.validate-node.result }}
        run: |
          echo "Node.js matrix result: $RESULT"
          test "$RESULT" = "success"
